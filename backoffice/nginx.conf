server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  # text/html is always compressed. woff2 is already compressed and is left out on purpose.
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
             image/svg+xml application/wasm font/ttf font/otf application/vnd.ms-fontobject application/x-font-ttf;

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every unknown path serves index.html (client-side routing).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
